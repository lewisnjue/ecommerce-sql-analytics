[project]
name = "ecommerce-sql-analytics"
version = "0.1.0"
description = "PostgreSQL analytics of the Brazilian Olist e-commerce dataset"
readme = "README.md"
authors = [
    { name = "lewisnjue", email = "njue.prime@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.8",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[project.scripts]
ecommerce-sql-analytics = "ecommerce_sql_analytics:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.6.3",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]

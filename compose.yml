services:
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./schema:/opt/schema
      - ./data:/opt/data

volumes:
  postgres_data:

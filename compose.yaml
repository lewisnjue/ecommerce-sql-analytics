services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  loader:
    build:
      context: .
      dockerfile: Dockerfile.loader
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-olist_analytics}
      PGUSER: ${POSTGRES_USER:-olist}
      PGPASSWORD: ${POSTGRES_PASSWORD:-olist}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: "no"

volumes:
  postgres_data: